     font-size="35.0" text-anchor="middle" transform="rotate(-3 100.0 100.0)">
    <text x="101.4" y="101.0" dy="0.34em" fill="#6E2A1C" fill-opacity="0.55">U</text>
    <text x="98.8" y="98.4" dy="0.34em" fill="#E2A48E" fill-opacity="0.85">U</text>
    <text x="100.0" y="100.0" dy="0.34em" fill="#A8503C">U</text>
  </g>

  <!-- 5. 全体のてかり -->
  <ellipse cx="85.0" cy="76.0" rx="30" ry="15" fill="#fff" opacity="0.22"
           filter="url(#soft)" style="mix-blend-mode:soft-light"/>
