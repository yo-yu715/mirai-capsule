  <!-- 2. 印章の縁の溝（円） -->
  <circle cx="100.0" cy="100.0" r="49.0" fill="none" stroke="#7E3322" stroke-opacity="0.5" stroke-width="2.2" filter="url(#soft)"/>

  <!-- 3. 凹んだ皿（上が影・下が光） -->
