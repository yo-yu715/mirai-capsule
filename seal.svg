    <linearGradient id="dish" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7E3322"/>
      <stop offset="0.5" stop-color="#9A4636"/>
      <stop offset="1" stop-color="#B45C46"/>
