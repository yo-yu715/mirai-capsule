<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Unletter の封蝋">
  <defs>
    <radialGradient id="dome" cx="40%" cy="32%" r="80%">
      <stop offset="0" stop-color="#CB6B51"/>
      <stop offset="0.55" stop-color="#A24A38"/>
      <stop offset="1" stop-color="#80331F"/>
    </radialGradient>
    <radialGradient id="dish" cx="50%" cy="60%" r="64%">
      <stop offset="0" stop-color="#AC5340"/>
      <stop offset="0.72" stop-color="#964435"/>
      <stop offset="1" stop-color="#7C3120"/>
    </radialGradient>
    <!-- 上に集まる影 / 下に集まる光（中央でなめらかに消える） -->
    <radialGradient id="topsh" cx="50%" cy="2%" r="72%">
      <stop offset="0" stop-color="#581F12" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#581F12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="botlt" cx="50%" cy="100%" r="62%">
      <stop offset="0" stop-color="#EDA88F" stop-opacity="0.6"/>
      <stop offset="0.62" stop-color="#EDA88F" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="175%">
      <feDropShadow dx="0" dy="7" stdDeviation="8.5" flood-color="#561F12" flood-opacity="0.40"/>
    </filter>
    <filter id="b1"><feGaussianBlur stdDeviation="0.9"/></filter>
    <filter id="b2"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="b3"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- 1. 押し広がった蝋 -->
