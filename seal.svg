  </g>

  <!-- 2. 印章の縁の溝 -->
  <circle cx="100.0" cy="100.0" r="49.0" fill="none" stroke="#79301F" stroke-opacity="0.42" stroke-width="2.4" filter="url(#b2)"/>

  <!-- 3. 凹んだ皿＋上影・下光（帯にならない） -->
  <circle cx="100.0" cy="100.0" r="46.0" fill="url(#dish)"/>
  <circle cx="100.0" cy="100.0" r="46.0" fill="url(#topsh)"/>
  <circle cx="100.0" cy="100.0" r="46.0" fill="url(#botlt)"/>
  <!-- 下ふちの細い catch-light -->
  <path d="M 71.5 136.8 A 44.0 44.0 0 0 0 128.5 136.8"
        fill="none" stroke="#F0B49E" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" filter="url(#b1)"/>

  <!-- 4. U のレリーフ（大きめ・タイト） -->
  <g font-family="Georgia, 'Times New Roman', 'Hiragino Mincho ProN', serif" font-weight="700"
     font-size="43.4" text-anchor="middle" transform="rotate(-3 100.0 100.0)">
    <text x="101.0" y="100.0" dy="0.34em" fill="#561F12" fill-opacity="0.5" filter="url(#b1)">U</text>
    <text x="99.1" y="98.8" dy="0.34em" fill="#EEBAA4" fill-opacity="0.92" filter="url(#b1)">U</text>
    <text x="100.0" y="100.0" dy="0.34em" fill="#A64E3A">U</text>
  </g>

  <!-- 5. てかり（弱く・広く） -->
  <ellipse cx="87.0" cy="73.0" rx="34" ry="16" fill="#fff" opacity="0.15" filter="url(#b3)" style="mix-blend-mode:soft-light"/>
</svg>
